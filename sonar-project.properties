# SonarQube - análisis del código propio del proyecto SGM-TB (Actividad 9)
# Ejecutar desde la raíz del repositorio (ver docs/CALIDAD_SOFTWARE.md):
#   docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN=<token> \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
sonar.projectKey=sgm-tb-transporte
sonar.projectName=SGM-TB Transporte Universitario (Odoo 16 + Traccar)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Solo los módulos del proyecto (los demás addons pertenecen a otras asignaturas/talleres)
sonar.sources=addons/transporte_core,addons/transporte_gps_traccar,addons/transporte_calidad,addons/transporte_ui,scripts
sonar.tests=addons/transporte_core/tests,addons/transporte_gps_traccar/tests,addons/transporte_calidad/tests,addons/transporte_ui/tests
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/tests/**,**/static/lib/**,**/__pycache__/**,**/demo/**,**/*.dump
sonar.python.version=3.9

# Cobertura de la lógica pura (generada con scripts/ejecutar_pruebas.sh)
sonar.python.coverage.reportPaths=backups/coverage-transporte_gps_traccar.xml,backups/coverage-transporte_calidad.xml
sonar.python.xunit.reportPath=backups/junit-*.xml
# La cobertura se mide sobre lib/ (lógica pura). Modelos/vistas Odoo se validan con el runner de Odoo.
sonar.coverage.exclusions=**/models/**,**/controllers/**,**/wizard/**,**/views/**,**/report/**,**/static/**,**/data/**,**/security/**,scripts/**,**/__manifest__.py,**/__init__.py
