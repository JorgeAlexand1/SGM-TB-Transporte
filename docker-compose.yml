version: '3.8'

services:
  web:
    image: odoo:16.0
    container_name: odoo16_web
    depends_on:
      - db
    ports:
      - "${ODOO_HOST_PORT:-8070}:8069"
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo_secret_pwd}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: odoo16_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo_secret_pwd}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    container_name: traccar_server
    ports:
      - "${TRACCAR_API_PORT:-8082}:8082"   # API REST / web
      - "${TRACCAR_GPS_PORT:-5055}:5055"   # protocolo OsmAnd (Traccar Client)
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
    restart: unless-stopped

volumes:
  traccar-data:
  traccar-logs:
  odoo-web-data:
  odoo-db-data: