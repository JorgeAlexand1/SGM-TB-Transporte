version: '3.8'

services:
  web:
    image: odoo:16.0
    container_name: odoo16_web
    depends_on:
      - db
    ports:
      - "${ODOO_HOST_PORT:-8070}:8069"
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD:-odoo_secret_pwd}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: odoo16_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-odoo_secret_pwd}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    container_name: traccar_server
    ports:
      - "${TRACCAR_API_PORT:-8082}:8082"   # API REST / web
      - "${TRACCAR_GPS_PORT:-5055}:5055"   # protocolo OsmAnd (Traccar Client)
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
    restart: unless-stopped

  # --- Conectividad externa (A2): Cloudflare Tunnel, sin IP pública ni puertos abiertos en el router ---
  # Túnel rápido (URL https://<aleatorio>.trycloudflare.com, cambia en cada arranque):
  #   docker compose --profile tunel up -d
  #   docker compose logs cloudflared-gps | grep trycloudflare
  # Traccar Client (teléfono, datos móviles): Dirección del servidor = esa URL HTTPS (puerto 443).
  cloudflared-gps:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_gps
    command: tunnel --no-autoupdate --url http://traccar:5055   # protocolo OsmAnd (HTTP) de Traccar Client
    depends_on:
      - traccar
    profiles: ["tunel"]
    restart: unless-stopped

  cloudflared-odoo:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_odoo
    command: tunnel --no-autoupdate --url http://web:8069        # Odoo accesible desde fuera (demo/defensa)
    depends_on:
      - web
    profiles: ["tunel"]
    restart: unless-stopped

  # Túnel con nombre (URL fija en un dominio propio de Cloudflare): definir CLOUDFLARE_TUNNEL_TOKEN en .env
  # y las rutas públicas en el panel Zero Trust (gps.dominio -> http://traccar:5055, odoo.dominio -> http://web:8069).
  #   docker compose --profile tunel-fijo up -d
  cloudflared-fijo:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_fijo
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-sin_token}
    depends_on:
      - traccar
      - web
    profiles: ["tunel-fijo"]
    restart: unless-stopped

volumes:
  traccar-data:
  traccar-logs:
  odoo-web-data:
  odoo-db-data: